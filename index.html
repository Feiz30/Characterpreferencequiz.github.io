<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6f52a1" />
  <title>人设喜爱度自测</title>
  <style>
    :root{--ink:#302840;--muted:#756c82;--paper:#fffdfa;--lav:#eee7f8;--brand:#6f52a1;--line:#e4ddeb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f6f0fb,#fdf9f3 55%,#eef4fa);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(720px,calc(100% - 28px));margin:auto;padding:34px 0 64px}.card{background:#fffdfaeF;border:1px solid #fff;border-radius:20px;box-shadow:0 10px 30px #49346215}.hero{padding:26px;margin-bottom:18px}h1{font-size:30px;margin:0 0 6px}h2{font-size:18px;margin:0;line-height:1.45}.sub,.tip{color:var(--muted);margin:0}.tip{font-size:13px;margin-top:8px}.progress{position:sticky;top:0;z-index:3;padding:10px 0;background:linear-gradient(#f7f2fbeF,#f7f2fbcc,transparent)}.progress>div{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}.track{height:8px;border-radius:99px;background:#e5ddec;overflow:hidden}.track b{display:block;height:100%;background:linear-gradient(90deg,#9273be,#d18eaa);transition:.2s}.q{padding:21px;margin:13px 0}.qhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.weight{background:var(--lav);color:#563b83;font-size:13px;font-weight:700;border-radius:99px;padding:3px 8px;white-space:nowrap}.options{display:grid;gap:9px;margin-top:16px}.options button{border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;padding:12px;cursor:pointer;color:var(--ink);font:inherit}.options button.selected{border-color:var(--brand);background:#f6f0ff;box-shadow:inset 0 0 0 1px var(--brand)}.letter{display:inline-block;width:26px;color:#563b83;font-weight:800}.actions{display:flex;justify-content:center;gap:12px;margin:28px 0 12px}button.main,button.reset{border:0;border-radius:12px;padding:13px 21px;font:inherit;font-weight:700;cursor:pointer}.main{background:var(--brand);color:white;box-shadow:0 5px 13px #553b8338}.reset{background:transparent;color:#563b83;border:1px solid #cbbddd!important}.warning{text-align:center;color:#a0445f;min-height:24px}.result{display:none;padding:26px;margin-top:22px}.score{font-size:56px;line-height:1;color:#563b83;font-weight:800;margin:8px 0}.score span{font-size:20px}.result h2{margin:0 0 18px}.result small{color:var(--muted)}@media(max-width:520px){.wrap{width:calc(100% - 20px);padding-top:18px}.hero,.q,.result{border-radius:16px;padding:18px}h1{font-size:26px}.qhead h2{font-size:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card hero"><h1>人设喜爱度自测</h1><p class="sub">GitHub Pages 功能测试版：题目内容之后再替换。</p></section>
    <div class="progress"><div><span>完成进度</span><span id="progress">0 / 7</span></div><div class="track"><b id="bar"></b></div></div>
    <div id="questions"></div>
    <p class="warning" id="warning"></p><div class="actions"><button class="main" id="submit">查看测试结果</button><button class="reset" id="reset">重新填写</button></div>
    <section class="card result" id="result" aria-live="polite"></section>
  </main>
  <script>
    const config=[
      ['测试题 1（后续替换为重跑意愿）',.25],['测试题 2（后续替换为相处愉悦感）',.20],['测试题 3（后续替换）',.15],['测试题 4（后续替换）',.15],['测试题 5（后续替换）',.10],['测试题 6（后续替换）',.10],['测试题 7（雷点测试）',.05]
    ];
    const letters=['A','B','C','D','E','F'], scores=[5,4,3,2,1,0], caps=[5,5,4.5,4,2.5,1];
    const answers=Array(7).fill(null), qs=document.querySelector('#questions');
    qs.innerHTML=config.map(([title,weight],i)=>`<section class="card q"><div class="qhead"><h2>Q${i+1}．${title}</h2><span class="weight">权重 ${(weight*100).toFixed(0)}%</span></div><p class="tip">选择任一选项测试计分；正式题目与选项会在下一版替换。</p><div class="options">${letters.map((l,j)=>`<button type="button" data-q="${i}" data-a="${j}"><span class="letter">${l}</span>测试选项 ${l}（${scores[j]} 分）</button>`).join('')}</div></section>`).join('');
    qs.addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;const q=+b.dataset.q,a=+b.dataset.a;answers[q]=a;document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');update();});
    function update(){const n=answers.filter(x=>x!==null).length;document.querySelector('#progress').textContent=`${n} / 7`;document.querySelector('#bar').style.width=`${n/7*100}%`;document.querySelector('#warning').textContent='';}
    document.querySelector('#submit').onclick=()=>{if(answers.includes(null)){document.querySelector('#warning').textContent='还有题目未选择。';return;}const base=answers.reduce((sum,a,i)=>sum+scores[a]*config[i][1],0);const cap=caps[answers[6]],final=Math.round(Math.min(base,cap)*2)/2;const verdict=final>=4.5?'测试通过：高喜爱度结果可正常显示。':final>=3?'测试通过：中等喜爱度结果可正常显示。':'测试通过：低喜爱度结果可正常显示。';const r=document.querySelector('#result');r.innerHTML=`<p class="sub">测试计算结果</p><div class="score">${final.toFixed(1)} <span>/ 5</span></div><h2>${verdict}</h2><small>基础分 ${base.toFixed(2)} · Q7 上限 ${cap.toFixed(1)} · 已按 0.5 分取整</small>`;r.style.display='block';r.scrollIntoView({behavior:'smooth',block:'start'});};
    document.querySelector('#reset').onclick=()=>{answers.fill(null);document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));document.querySelector('#result').style.display='none';update();window.scrollTo({top:0,behavior:'smooth'});};
  </script>
</body>
</html>
